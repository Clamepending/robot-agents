[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-policy-mcp"
version = "0.1.0"
description = "MCP server for OpenClaw robot policy execution with SO-101 support"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OpenClaw Robotics"}]
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "tenacity>=8.3",
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "fastapi>=0.115",
  "uvicorn>=0.31",
]

[project.scripts]
robot-policy-mcp = "robot_policy_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
